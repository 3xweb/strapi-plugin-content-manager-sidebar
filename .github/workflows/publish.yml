name: Stage npm release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-staging
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == '3xweb/strapi-plugin-content-manager-sidebar' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm test
      - name: Stage package for approval
        run: npx --yes --package npm@11.21.3 npm stage publish --access public
